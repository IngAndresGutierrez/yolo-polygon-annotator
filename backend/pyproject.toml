[project]
name = "yolo-polygon-annotator-backend"
version = "0.1.0"
description = "Local API for the YOLO Polygon Annotator"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = ["fastapi (>=0.143.0,<0.144.0)", "uvicorn (>=0.54.0,<0.55.0)", "pydantic (>=2.14.1,<3.0.0)", "pillow (>=12.3.0,<13.0.0)", "defusedxml (>=0.7.1,<0.8.0)", "python-multipart (>=0.0.32,<0.0.33)"]

[tool.poetry]
packages = [{ include = "annotator", from = "src" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "ruff (>=0.17.0,<0.18.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "httpx2 (>=2.13.1,<3.0.0)"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PTH"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PTH"]
